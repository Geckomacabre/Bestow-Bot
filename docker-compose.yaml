services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the container the database lives on the named volume below.
      DB_PATH: /app/data/onyx.db
    volumes:
      - onyx-data:/app/data
    ports:
      - "3000:3000"      # web dashboard (remove if you don't use it)

  # Optional: your own search engine for `/tools search` (then set SEARXNG_URL=http://searxng:8080 in .env).
  # searxng:
  #   image: searxng/searxng
  #   restart: unless-stopped

volumes:
  onyx-data:
