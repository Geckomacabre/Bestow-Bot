name: bestow

services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the container the database lives on the named volume below, and it always runs in production mode
      # (a development-mode .env used on your own machine must not leak into the container).
      DB_PATH: /app/data/bestow.db
      NODE_ENV: production
    volumes:
      - bestow-data:/app/data
    ports:
      - "${WEB_PORT:-3000}:3000"      # web dashboard (set WEB_PORT if 3000 is taken; remove this line if you don't use it)

  # Optional: your own search engine for `/search` (then set SEARXNG_URL=http://searxng:8080 in .env).
  # searxng:
  #   image: searxng/searxng
  #   restart: unless-stopped

volumes:
  bestow-data:
