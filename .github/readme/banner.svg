<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Bestow</title>
  <desc id="d">The multipurpose Discord bot you add to your own account. Built with Bun, TypeScript and discord.js.</desc>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #ffffff; }
    .title { font-size: 104px; font-weight: 800; letter-spacing: -2px; }
    .tag   { font-size: 30px; font-weight: 500; fill-opacity: 0.92; }
    .pill  { font-size: 19px; font-weight: 600; }
    .small { font-size: 14px; font-weight: 700; letter-spacing: 3px; fill-opacity: 0.6; }
    .tech  { font-size: 20px; font-weight: 600; fill-opacity: 0.9; }
  </style>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1d4d"/>
      <stop offset="0.55" stop-color="#4450d6"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#ff7ad9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff7ad9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.05" cy="1" r="0.7">
      <stop offset="0" stop-color="#3ee0ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3ee0ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
  </defs>
  
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#glowA)"/>
  <rect width="1280" height="420" rx="28" fill="url(#glowB)"/>
  <rect width="1280" height="420" rx="28" fill="url(#dots)"/>
  
